name: Import source
on:
  push:
    branches: [ dev ]
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, 'bootstrap-source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract
        run: |
          curl -L --fail -o /tmp/src.zip "https://aka.doubaocdn.com/s/flrpqlytMm"
          unzip -o /tmp/src.zip -d .
      - name: Commit source
        run: |
          rm -f .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f app_icon.png build/app_icon.ico
          git commit -m "feat: add version number for v1.0.0"
          git push
