name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Functional tests (Windows / PyQt5)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      IPAB_CI: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import PyQt5.QtCore as c; print('Qt', c.QT_VERSION_STR)"

      - name: Run functional tests
        run: python tools/functional_test.py
